name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race matters here: status collection and PR lookup both write into a
      # shared slice from several goroutines at once.
      - name: go test
        run: go test -race -count=1 ./...

      # -x follows the sourced install.sh; warning severity skips style nits.
      - name: shellcheck
        run: shellcheck -x --severity=warning install.sh install_test.sh

      - name: install.sh self-test
        run: sh install_test.sh
